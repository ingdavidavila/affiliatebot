# Copy this file to config.yaml and edit it. (config.yaml is ignored by git.)
# API keys do NOT go here. They go in .env (see .env.example).

# Where the bot and dashboard keep their data.
database: data/affiliate.db

# true  = find deals and write posts, but never send anything to X (safe for testing)
# false = post for real (costs money on the X API)
dry_run: true

sources:
  # Fake deals so you can test everything with no API keys. Turn off once a real source works.
  demo:
    enabled: true

  # eBay Browse API + eBay Partner Network links. Needs EBAY_APP_ID, EBAY_CERT_ID, EPN_CAMPAIGN_ID in .env.
  ebay:
    enabled: false
    marketplace: EBAY_US
    keywords: ["wireless headphones", "air fryer", "mechanical keyboard"]
    category_ids: []        # optional eBay category ids, e.g. [175672] for laptops
    limit: 50               # results per keyword

  # Automatic Amazon deals from Keepa's price-history database (paid Keepa API plan).
  # Needs KEEPA_API_KEY and AMAZON_ASSOCIATE_TAG in .env. Finds items whose price
  # dropped vs. their 90-day average. Posts show the % drop, not the price (Amazon rules).
  keepa:
    enabled: false
    domain: US                 # US, GB, DE, CA
    price_type: amazon         # amazon = sold by Amazon, new = third-party new
    compare_to: 90days         # day, week, month, 90days
    min_drop_pct: 30
    min_price: 15
    max_price: 500
    pages: 1                   # 150 deals per page; each page costs 5 Keepa tokens
    include_categories: []     # Amazon category ids, e.g. [172282] for Electronics
    exclude_categories: []

  # Optional: deals you paste into data/manual_deals.csv yourself.
  manual:
    enabled: false
    file: data/manual_deals.csv

# Pulls your commissions automatically so the dashboard stays current with no downloads.
# Supported: ebay (needs EPN_ACCOUNT_SID and EPN_AUTH_TOKEN in .env).
# Amazon has no earnings API; import its report on the Earnings page if you want it counted.
earnings_sync:
  networks: []                 # e.g. [ebay]
  every_hours: 6
  days_back: 45                # re-checks older sales whose status changed

# Starting values for the posting rules. After the first run you can change
# these from the dashboard's Settings page instead (the dashboard wins).
settings:
  paused: false
  approval_mode: false         # false = autopilot (no human input); true = approve deals in the Queue
  learn_from_sales: true       # favor categories that have earned you money
  category_cooldown_posts: 3   # don't repeat a category from the last 3 posts
  max_deal_age_hours: 24       # drop deals that weren't posted within a day
  failure_cooldown_hours: 6    # after 3 failed posts in a row, wait, then retry by itself
  min_discount_pct: 30
  min_price: 10
  max_price: 1000
  max_posts_per_day: 8
  posts_per_run: 1
  min_minutes_between_posts: 60
  daily_budget_usd: 3.00
  blocked_keywords: "refurbished, for parts, replica"
  hashtags: "#deal #sale"
  disclosure: "#ad"            # FTC requires a clear disclosure on affiliate posts

# X API pay-per-use prices as of Sept 2026. Update if X changes them.
costs:
  x_post_with_link_usd: 0.20
  x_post_without_link_usd: 0.015

dashboard:
  host: 127.0.0.1   # only reachable from your own Mac
  port: 8765
